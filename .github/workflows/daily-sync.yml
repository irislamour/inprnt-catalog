name: INPRNT daily sync
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inprnt-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python sync.py
      - name: Publish changed catalog
        run: |
          git config user.name 'INPRNT catalog sync'
          git config user.email 'inprnt-sync@users.noreply.github.com'
          git add catalog.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update INPRNT artwork catalog'
            git push
          fi